name: Andarium Red - validate 16 GiB compressed memory
on:
  push:
    branches: [feature/andd-memory-tuning]
    paths:
      - 'build-requests/github-zram-16g-probe-*.txt'
permissions:
  contents: read
jobs:
  verify-sixteen-gib-zram-swap:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate and verify additional 16 GiB high-priority ZRAM swap
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/provision_android17_zram_swap.sh
          bash scripts/provision_android17_zram_swap.sh 16 | tee zram-memory-result.txt
          grep -Fx 'ANDARIUM_ADDITIONAL_ZRAM_SWAP_GIB=16' zram-memory-result.txt
          cat zram-memory-result.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: andarium-16g-zram-compatibility
          path: zram-memory-result.txt
          retention-days: 14
          if-no-files-found: error
