name: Andarium Red v17 - Xcode 27 first compile (unsigned)
# Public repository: an exact, scoped, one-time push receipt may launch
# source and full-host checks without interactive browser authentication.
# Only dedicated preview/host requests on the reviewed feature branch trigger.
# No signing secrets are used.
on:
  push:
    branches: [feature/andd-memory-tuning]
    paths:
      - 'build-requests/preview-*.txt'
      - 'build-requests/host-*.txt'
  workflow_dispatch:
    inputs:
      phase:
        description: "Source gate, Simulator smoke, full host compile, or verified modified Red Android 17 IPA"
        required: true
        type: choice
        default: preview
        options:
          - source
          - preview
          - host-unsigned
          - red-ipa
      guest_proof_run_id:
        description: "Run ID containing genuine compiled Android 17 proof artifact for red-ipa"
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: andarium-first-build-${{ github.ref }}-${{ inputs.phase || (contains(github.event.head_commit.message, '[host-unsigned]') && 'host-unsigned' || 'preview') }}
  cancel-in-progress: false

jobs:
  first-compile:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      KERNARIUM_REVISION: fbe12ee72d195f0241c4fc24090a98b259026604
      ANDARIUM_UPSTREAM: https://github.com/imxieyi/Kernarium.git
    steps:
      - name: Check out exact Andarium Red source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK for actual Java source harnesses
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Toolchain and workspace receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ci
          {
            echo "Andarium source: $GITHUB_SHA"
            echo "Reviewed Kernarium source: $KERNARIUM_REVISION"
            uname -a
            xcodebuild -version
            swiftc -version
            javac -version
            df -h .
          } 2>&1 | tee .build/ci/toolchain.txt

      - name: Checkout exact reviewed Kernarium for source overlays
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$ANDARIUM_UPSTREAM" .build/Kernarium
          git -C .build/Kernarium checkout --detach "$KERNARIUM_REVISION"
          test "$(git -C .build/Kernarium rev-parse HEAD)" = "$KERNARIUM_REVISION"
          test -f .build/Kernarium/Andarium/Andarium.xcodeproj/project.xcproj
          test -f .build/Kernarium/android/lineage-24/overlay/lineage_andarium.mk

      - name: Integrate and validate original source (no signing)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/first_build.sh "$PWD/.build/Kernarium" 2>&1 |
            tee .build/ci/source-gate.log

      - name: Compile AndariumPreview with Xcode 27
        if: inputs.phase == 'preview' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        run: |
          set -euo pipefail
          cd .build/Kernarium
          xcodebuild -project Andarium/Andarium.xcodeproj \
            -scheme AndariumPreview -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 |
            tee "$GITHUB_WORKSPACE/.build/ci/preview-xcodebuild.log"

      - name: Require an actual compiled Red Android 17 guest proof
        if: inputs.phase == 'red-ipa'
        shell: bash
        env:
          PROOF_RUN_ID: ${{ inputs.guest_proof_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$PROOF_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: red-ipa requires a real Android 17 build's numeric guest_proof_run_id." >&2
            echo "The native host and Android image must both be built. No mock/upstream IPA is distributed." >&2
            exit 1
          fi

      - name: Download compiled Red Android 17 guest proof from this repository
        if: inputs.phase == 'red-ipa'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.guest_proof_run_id }}
          name: andarium-red-android17-proof
          github-token: ${{ github.token }}
          path: .build/red-proof

      - name: Verify modified Andarium source and compiled Android 17 proof
        if: inputs.phase == 'red-ipa'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_red_android17_guest.py \
            --proof .build/red-proof --kernarium .build/Kernarium 2>&1 |
            tee .build/ci/red-android17-proof.log

      - name: Build pinned Kernarium iOS GPU, networking and storage dependencies
        if: inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_kernarium_ios_dependencies.sh "$PWD/.build/Kernarium" 2>&1 |
            tee .build/ci/ios-native-dependencies.log

      - name: Compile the actual modified Andarium Red iPhoneOS host
        if: inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        env:
          BUILD_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_PHASE" == red-ipa ]]; then
            # Unlike host-unsigned, this mode MUST embed the verified compiled
            # Red guest. No substitution with upstream's accepted guest.
            bash scripts/first_build.sh "$PWD/.build/Kernarium" \
              --build --guest-proof "$PWD/.build/red-proof" 2>&1 |
              tee .build/ci/host-xcodebuild.log
          else
            echo "Compiler smoke only: upstream accepted guest is NOT modified Red Android."
            bash scripts/first_build.sh "$PWD/.build/Kernarium" --build 2>&1 |
              tee .build/ci/host-xcodebuild.log
          fi

      - name: Package verified modified Andarium Red Android 17 full-host IPA
        if: inputs.phase == 'red-ipa'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_unsigned_ipa.sh \
            .build/Kernarium/.build/DerivedDataAndariumHost/Build/Products/Release-iphoneos/Andarium.app \
            .build/ipa "$PWD/.build/Kernarium"

      - name: Upload the real modified Andarium Red Android 17 unsigned IPA
        if: inputs.phase == 'red-ipa'
        uses: actions/upload-artifact@v4
        with:
          name: andarium-red-android17-fullhost-unsigned-ipa-${{ github.sha }}
          path: |
            .build/ipa/*.ipa
            .build/ipa/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Persist compiler diagnostics on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andarium-first-compile-${{ inputs.phase || (contains(github.event.head_commit.message, '[host-unsigned]') && 'host-unsigned' || 'preview') }}-${{ github.sha }}
          path: |
            .build/ci/*.txt
            .build/ci/*.log
          if-no-files-found: warn
          retention-days: 7
