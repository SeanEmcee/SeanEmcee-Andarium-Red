name: Andarium Red v17 - Xcode 27 first compile (unsigned)
# Public repository: an exact, scoped, one-time push receipt may launch
# the Xcode preview without interactive browser authentication.
# Only dedicated preview, device-IPA or host requests on the feature branch trigger.
# No signing secrets are used.
on:
  push:
    branches: [feature/andd-memory-tuning]
    paths:
      - 'build-requests/preview-*.txt'
      - 'build-requests/host-*.txt'
      - 'build-requests/ipa-*.txt'
  workflow_dispatch:
    inputs:
      phase:
        description: "Source gate, Simulator preview, device preview IPA or full unsigned host compile"
        required: true
        type: choice
        default: preview
        options:
          - source
          - preview
          - ipa-preview
          - host-unsigned

permissions:
  contents: read

concurrency:
  group: andarium-first-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  first-compile:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      KERNARIUM_REVISION: fbe12ee72d195f0241c4fc24090a98b259026604
      ANDARIUM_UPSTREAM: https://github.com/imxieyi/Kernarium.git
    steps:
      - name: Check out exact Andarium Red source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK for actual Java source harnesses
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Toolchain and workspace receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ci
          {
            echo "Andarium source: $GITHUB_SHA"
            echo "Reviewed Kernarium source: $KERNARIUM_REVISION"
            uname -a
            xcodebuild -version
            swiftc -version
            javac -version
            df -h .
          } 2>&1 | tee .build/ci/toolchain.txt

      - name: Checkout exact reviewed Kernarium for source overlays
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$ANDARIUM_UPSTREAM" .build/Kernarium
          git -C .build/Kernarium checkout --detach "$KERNARIUM_REVISION"
          test "$(git -C .build/Kernarium rev-parse HEAD)" = "$KERNARIUM_REVISION"
          test -f .build/Kernarium/Andarium/Andarium.xcodeproj/project.xcproj
          test -f .build/Kernarium/android/lineage-24/overlay/lineage_andarium.mk

      - name: Integrate and validate original source (no signing)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/first_build.sh "$PWD/.build/Kernarium" 2>&1 |
            tee .build/ci/source-gate.log

      - name: Compile AndariumPreview with Xcode 27
        if: inputs.phase == 'preview' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[host-unsigned]') && !contains(github.event.head_commit.message, '[ipa-preview]'))
        shell: bash
        run: |
          set -euo pipefail
          cd .build/Kernarium
          xcodebuild -project Andarium/Andarium.xcodeproj \
            -scheme AndariumPreview -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 |
            tee "$GITHUB_WORKSPACE/.build/ci/preview-xcodebuild.log"

      - name: Build unsigned iPhoneOS AndariumPreview UI for IPA
        if: inputs.phase == 'ipa-preview' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ipa-preview]'))
        shell: bash
        run: |
          set -euo pipefail
          cd .build/Kernarium
          # Override the upstream preview target's Simulator-only setting for
          # this explicitly labeled iPhone UI import test. No Android guest.
          xcodebuild -project Andarium/Andarium.xcodeproj \
            -scheme AndariumPreview -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build/DerivedDataPreviewDevice" \
            'SUPPORTED_PLATFORMS=iphoneos iphonesimulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 |
            tee "$GITHUB_WORKSPACE/.build/ci/preview-iphoneos-xcodebuild.log"

      - name: Package validated unsigned iPhoneOS preview IPA
        if: inputs.phase == 'ipa-preview' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ipa-preview]'))
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_unsigned_ipa.sh \
            .build/DerivedDataPreviewDevice/Build/Products/Debug-iphoneos/AndariumPreview.app \
            .build/ipa preview

      - name: Build pinned Kernarium iOS GPU, networking and storage dependencies
        if: inputs.phase == 'host-unsigned' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_kernarium_ios_dependencies.sh "$PWD/.build/Kernarium" 2>&1 |
            tee .build/ci/ios-native-dependencies.log

      - name: Attempt unsigned Andarium host compilation
        if: inputs.phase == 'host-unsigned' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        run: |
          set -euo pipefail
          echo "Host compile requires a valid accepted upstream guest image; it does NOT build the custom Android 17 image."
          bash scripts/first_build.sh "$PWD/.build/Kernarium" --build 2>&1 |
            tee .build/ci/host-xcodebuild.log

      - name: Package validated unsigned full Andarium host IPA
        if: inputs.phase == 'host-unsigned' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_unsigned_ipa.sh \
            .build/Kernarium/.build/DerivedDataAndariumHost/Build/Products/Release-iphoneos/Andarium.app \
            .build/ipa host

      - name: Upload importable unsigned iPhoneOS IPA artifact
        if: inputs.phase == 'ipa-preview' || inputs.phase == 'host-unsigned' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ipa-preview]') || contains(github.event.head_commit.message, '[host-unsigned]')))
        uses: actions/upload-artifact@v4
        with:
          name: andarium-red-iphoneos-unsigned-ipa-${{ github.sha }}
          path: |
            .build/ipa/*.ipa
            .build/ipa/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Persist compiler diagnostics on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andarium-first-compile-${{ inputs.phase || (contains(github.event.head_commit.message, '[host-unsigned]') && 'host-unsigned' || (contains(github.event.head_commit.message, '[ipa-preview]') && 'ipa-preview' || 'preview')) }}-${{ github.sha }}
          path: |
            .build/ci/*.txt
            .build/ci/*.log
          if-no-files-found: warn
          retention-days: 7
