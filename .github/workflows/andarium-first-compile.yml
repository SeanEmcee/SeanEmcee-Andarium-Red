name: Andarium Red v17 - Xcode 27 first compile (unsigned)
# Public repository: an exact, scoped, one-time push receipt may launch
# source and full-host checks without interactive browser authentication.
# Only dedicated preview/host requests on the reviewed feature branch trigger.
# No signing secrets are used.
on:
  push:
    branches: [feature/andd-memory-tuning]
    paths:
      - 'build-requests/preview-*.txt'
      - 'build-requests/host-*.txt'
  workflow_dispatch:
    inputs:
      phase:
        description: "Source gate, Simulator smoke, full host compile, or verified modified Red Android 17 IPA"
        required: true
        type: choice
        default: preview
        options:
          - source
          - preview
          - host-unsigned
          - red-ipa
      guest_proof_run_id:
        description: "Run ID containing genuine compiled Android 17 proof artifact for red-ipa"
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: andarium-first-build-${{ github.ref }}-${{ inputs.phase || (contains(github.event.head_commit.message, '[host-unsigned]') && 'host-unsigned' || 'preview') }}
  cancel-in-progress: false

jobs:
  first-compile:
    if: github.ref == 'refs/heads/feature/andd-memory-tuning'
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      KERNARIUM_REVISION: fbe12ee72d195f0241c4fc24090a98b259026604
      ANDARIUM_UPSTREAM: https://github.com/imxieyi/Kernarium.git
    steps:
      - name: Check out exact Andarium Red source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK for actual Java source harnesses
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Toolchain and workspace receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ci
          {
            echo "Andarium source: $GITHUB_SHA"
            echo "Reviewed Kernarium source: $KERNARIUM_REVISION"
            uname -a
            xcodebuild -version
            swiftc -version
            javac -version
            df -h .
          } 2>&1 | tee .build/ci/toolchain.txt

      - name: Checkout exact reviewed Kernarium for source overlays
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$ANDARIUM_UPSTREAM" .build/Kernarium
          git -C .build/Kernarium checkout --detach "$KERNARIUM_REVISION"
          test "$(git -C .build/Kernarium rev-parse HEAD)" = "$KERNARIUM_REVISION"
          test -f .build/Kernarium/Andarium/Andarium.xcodeproj/project.xcproj
          test -f .build/Kernarium/android/lineage-24/overlay/lineage_andarium.mk

      - name: Integrate and validate original source (no signing)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/first_build.sh "$PWD/.build/Kernarium" 2>&1 |
            tee .build/ci/source-gate.log

      - name: Compile AndariumPreview with Xcode 27
        if: inputs.phase == 'preview' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        run: |
          set -euo pipefail
          cd .build/Kernarium
          xcodebuild -project Andarium/Andarium.xcodeproj \
            -scheme AndariumPreview -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 |
            tee "$GITHUB_WORKSPACE/.build/ci/preview-xcodebuild.log"

      - name: Require an actual compiled Red Android 17 guest proof
        if: inputs.phase == 'red-ipa'
        shell: bash
        env:
          PROOF_RUN_ID: ${{ inputs.guest_proof_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$PROOF_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: red-ipa requires a real Android 17 build's numeric guest_proof_run_id." >&2
            echo "The native host and Android image must both be built. No mock/upstream IPA is distributed." >&2
            exit 1
          fi

      - name: Download compiled Red Android 17 guest proof from this repository
        if: inputs.phase == 'red-ipa'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.guest_proof_run_id }}
          name: andarium-red-android17-proof
          github-token: ${{ github.token }}
          path: .build/red-proof

      - name: Verify modified Andarium source and compiled Android 17 proof
        if: inputs.phase == 'red-ipa'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_red_android17_guest.py \
            --proof .build/red-proof --kernarium .build/Kernarium 2>&1 |
            tee .build/ci/red-android17-proof.log

      # Cache immutable, pinned *verified artifacts*, never unverified .o files.
      # Kernarium's verifier runs again on every restored kernel.
      - name: Restore verified ABI29 kernel artifact cache
        id: kernel_cache
        if: inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        uses: actions/cache/restore@v4
        with:
          path: .build/Kernarium/.build/kernel/artifacts/android-6.18-arm64-4k-20261119-6.18.60-ca1
          key: andarium-abi29-kernel-v1-${{ runner.os }}-${{ runner.arch }}-fbe12ee72d195f0241c4fc24090a98b259026604-ee913342fecf9f7f9836b616f5c605a036da0098-${{ hashFiles('.build/Kernarium/kernel/mainline-6.18/artifacts/accepted-android-4k.env') }}

      # The currently running first successful kernel build has no cache-save
      # step. Its separate, verified GitHub artifact is still reusable even if
      # its subsequent Xcode host compile fails. This is an artifact *candidate*
      # until the original Kernarium verifier accepts it below.
      - name: Find previously uploaded verified kernel candidate
        id: prior_kernel
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && steps.kernel_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/find_reusable_kernel_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --exclude-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download previously uploaded kernel candidate
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && steps.prior_kernel.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.prior_kernel.outputs.run_id }}
          name: ${{ steps.prior_kernel.outputs.artifact_name }}
          github-token: ${{ github.token }}
          path: .build/Kernarium/.build/kernel/artifacts/android-6.18-arm64-4k-20261119-6.18.60-ca1

      - name: Verify restored kernel against pinned Kernarium descriptor
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && (steps.kernel_cache.outputs.cache-hit == 'true' || steps.prior_kernel.outputs.found == 'true')
        shell: bash
        run: |
          set -euo pipefail
          kernel=.build/Kernarium/.build/kernel/artifacts/android-6.18-arm64-4k-20261119-6.18.60-ca1
          common=.build/Kernarium/kernel/common
          python3 -B "$common/artifacts/verify-kernel-artifact.py" \
            --artifact "$PWD/$kernel" --common-root "$PWD/$common" \
            --abi-metadata "$PWD/$common/abi/identity.env" \
            --compatible --expected-family android-6.18 \
            --expected-slice arm64 --expected-release-series 6.18 \
            --descriptor "$PWD/.build/Kernarium/kernel/mainline-6.18/artifacts/accepted-android-4k.env"

      # Native prefix builders refuse invalid old prefixes and verify cached
      # GPU/network/storage/zstd products against their upstream contracts.
      - name: Restore verified iPhoneOS native dependency cache
        id: native_cache
        if: inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/Kernarium/.build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64
            .build/Kernarium/.build/dependencies/ios-device-arm64/network
            .build/Kernarium/.build/dependencies/ios-storage
            .build/Kernarium/.build/dependencies/ios-zstd
          key: andarium-ios27-native-v1-${{ runner.os }}-${{ runner.arch }}-fbe12ee72d195f0241c4fc24090a98b259026604-${{ hashFiles('scripts/patch_kernarium_mesa_cross_endian.py', 'scripts/prepare_kernarium_ios_dependencies.sh', '.build/Kernarium/dependencies/manifest.tsv') }}

      - name: Build pinned Kernarium iOS GPU, networking and storage dependencies
        if: inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_kernarium_ios_dependencies.sh "$PWD/.build/Kernarium" 2>&1 |
            tee .build/ci/ios-native-dependencies.log

      - name: Save verified iPhoneOS native dependency cache
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .build/Kernarium/.build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64
            .build/Kernarium/.build/dependencies/ios-device-arm64/network
            .build/Kernarium/.build/dependencies/ios-storage
            .build/Kernarium/.build/dependencies/ios-zstd
          key: ${{ steps.native_cache.outputs.cache-primary-key }}

      # Cache both the compiled host tools and their original verified source
      # checkouts. Kernarium's own --verify-only checks the restored prefix
      # against those source trees before any use; invalid caches fail closed.
      - name: Restore pinned kernel host-tools and source cache
        id: host_tools_cache
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && steps.kernel_cache.outputs.cache-hit != 'true' && steps.prior_kernel.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/Kernarium/.build/dependencies/kernel-host-tools
            .build/Kernarium/.build/dependency-cache/git/gawk
            .build/Kernarium/.build/dependency-cache/git/argp-standalone
            .build/Kernarium/.build/dependency-cache/git/musl-obstack
            .build/Kernarium/.build/dependency-cache/git/elfutils
            .build/Kernarium/.build/dependency-cache/git/libbpf
            .build/Kernarium/.build/dependency-cache/git/dwarves
            .build/Kernarium/.build/dependency-cache/archives
            .build/Kernarium/external/sources/gawk
            .build/Kernarium/external/sources/argp-standalone
            .build/Kernarium/external/sources/musl-obstack
            .build/Kernarium/external/sources/elfutils
            .build/Kernarium/external/sources/libbpf
            .build/Kernarium/external/sources/dwarves
          key: andarium-kernel-host-tools-v1-${{ runner.os }}-${{ runner.arch }}-fbe12ee72d195f0241c4fc24090a98b259026604-${{ hashFiles('.build/Kernarium/dependencies/manifest.tsv', '.build/Kernarium/dependencies/kernel-host-tools/archives.tsv') }}

      - name: Prepare and independently verify Kernarium kernel host tools
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && steps.kernel_cache.outputs.cache-hit != 'true' && steps.prior_kernel.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_kernarium_kernel_host_tools.sh "$PWD/.build/Kernarium" 2>&1 |
            tee .build/ci/kernel-host-tools.log

      - name: Save pinned kernel host-tools and authenticated source cache
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && steps.kernel_cache.outputs.cache-hit != 'true' && steps.prior_kernel.outputs.found != 'true' && steps.host_tools_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .build/Kernarium/.build/dependencies/kernel-host-tools
            .build/Kernarium/.build/dependency-cache/git/gawk
            .build/Kernarium/.build/dependency-cache/git/argp-standalone
            .build/Kernarium/.build/dependency-cache/git/musl-obstack
            .build/Kernarium/.build/dependency-cache/git/elfutils
            .build/Kernarium/.build/dependency-cache/git/libbpf
            .build/Kernarium/.build/dependency-cache/git/dwarves
            .build/Kernarium/.build/dependency-cache/archives
            .build/Kernarium/external/sources/gawk
            .build/Kernarium/external/sources/argp-standalone
            .build/Kernarium/external/sources/musl-obstack
            .build/Kernarium/external/sources/elfutils
            .build/Kernarium/external/sources/libbpf
            .build/Kernarium/external/sources/dwarves
          key: ${{ steps.host_tools_cache.outputs.cache-primary-key }}

      - name: Build and verify pinned Android 17 ARM64 4 KiB kernel
        if: inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_kernarium_4k_kernel.sh "$PWD/.build/Kernarium" 2>&1 |
            tee .build/ci/android-4k-kernel.log

      - name: Save authentically verified ABI29 kernel artifact cache
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && steps.kernel_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .build/Kernarium/.build/kernel/artifacts/android-6.18-arm64-4k-20261119-6.18.60-ca1
          key: ${{ steps.kernel_cache.outputs.cache-primary-key }}

      - name: Upload authentically verified ABI 29 kernel artifact
        if: inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        uses: actions/upload-artifact@v4
        with:
          name: andarium-pinned-android17-abi29-4k-kernel-${{ github.sha }}
          path: .build/Kernarium/.build/kernel/artifacts/android-6.18-arm64-4k-20261119-6.18.60-ca1/
          if-no-files-found: error
          retention-days: 14

      # The actual 4 KiB ABI29 kernel, native dependencies, and host tools
      # are cached separately. Publish the iPhoneOS Android runtime itself
      # before requiring an x86_64 Linux-built Red guest image.
      - name: Restore source-keyed iPhoneOS Android runtime XCFramework cache
        id: ios_runtime_cache
        if: inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        uses: actions/cache/restore@v4
        with:
          path: .build/Kernarium/.build/kernarium-xcframeworks
          key: andarium-ios27-runtime-v1-${{ runner.os }}-${{ runner.arch }}-fbe12ee72d195f0241c4fc24090a98b259026604-ee913342fecf9f7f9836b616f5c605a036da0098-${{ hashFiles('integrate_andarium.py', 'host/**', 'guest_clipboard/**', 'launcher_src/**', 'red_runtime_overlay.py', 'host_firstboot.py', 'install_source_overlay.py', 'tools/**', 'scripts/first_build.sh', 'scripts/verify_ios_runtime_xcframeworks.py') }}

      - name: Compile or verify iPhoneOS Android runtime without fabricating guest image
        if: inputs.phase == 'host-unsigned' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        shell: bash
        env:
          ANDARIUM_REUSE_VERIFIED_RUNTIME: ${{ steps.ios_runtime_cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          bash scripts/first_build.sh "$PWD/.build/Kernarium" --build --runtime-only 2>&1 |
            tee .build/ci/host-runtime-xcframeworks.log

      # The full app is only attempted if a real modified Android17 guest
      # proof was downloaded and independently verified earlier.
      - name: Compile actual modified Andarium Red iPhoneOS host with verified guest
        if: inputs.phase == 'red-ipa'
        shell: bash
        env:
          ANDARIUM_REUSE_VERIFIED_RUNTIME: ${{ steps.ios_runtime_cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          bash scripts/first_build.sh "$PWD/.build/Kernarium" \
            --build --with-apps --guest-proof "$PWD/.build/red-proof" 2>&1 |
            tee .build/ci/host-xcodebuild.log

      - name: Save validated iPhoneOS Android runtime XCFramework cache
        if: (inputs.phase == 'host-unsigned' || inputs.phase == 'red-ipa' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))) && steps.ios_runtime_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .build/Kernarium/.build/kernarium-xcframeworks
          key: ${{ steps.ios_runtime_cache.outputs.cache-primary-key }}

      - name: Upload checked iPhoneOS runtime XCFrameworks for independent inspection
        if: inputs.phase == 'host-unsigned' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[host-unsigned]'))
        uses: actions/upload-artifact@v4
        with:
          name: andarium-red-ios27-android-runtime-xcframeworks-${{ github.sha }}
          path: .build/Kernarium/.build/kernarium-xcframeworks/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Package verified modified Andarium Red Android 17 full-host IPA
        if: inputs.phase == 'red-ipa'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_unsigned_ipa.sh \
            .build/Kernarium/.build/DerivedDataAndariumHost/Build/Products/Release-iphoneos/Andarium.app \
            .build/ipa "$PWD/.build/Kernarium"

      - name: Upload the real modified Andarium Red Android 17 unsigned IPA
        if: inputs.phase == 'red-ipa'
        uses: actions/upload-artifact@v4
        with:
          name: andarium-red-android17-fullhost-unsigned-ipa-${{ github.sha }}
          path: |
            .build/ipa/*.ipa
            .build/ipa/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Persist compiler diagnostics on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andarium-first-compile-${{ inputs.phase || (contains(github.event.head_commit.message, '[host-unsigned]') && 'host-unsigned' || 'preview') }}-${{ github.sha }}
          path: |
            .build/ci/*.txt
            .build/ci/*.log
          if-no-files-found: warn
          retention-days: 7
