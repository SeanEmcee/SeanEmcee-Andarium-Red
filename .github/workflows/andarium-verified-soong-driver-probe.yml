name: Andarium Red - verify pinned producer before Soong host memory
on:
  push:
    branches: [feature/andd-memory-tuning]
    paths:
      - 'build-requests/verified-soong-driver-probe-*.txt'
permissions:
  contents: read
jobs:
  verify-producer-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run exact upstream verifier ordering and reversible Go host patch tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/create_verified_soong_build_driver.py
          python3 -B scripts/test_verified_soong_driver.py
          python3 -B scripts/test_soong_host_runtime_patch.py
          bash -n scripts/build_red_android17_proof.sh
          echo 'PASS: original verifiers, in-process Go memory change and restore before final verifier' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/restore@v4
        with:
          path: .build/Kernarium
          key: andarium-gh-kernarium-fbe12ee72d195f0241c4fc24090a98b259026604
      - name: Test against actual pinned Kernarium producer (not just fixture)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .build/Kernarium/.git ]]; then
            test ! -e .build/Kernarium
            git clone --filter=blob:none --no-checkout https://github.com/imxieyi/Kernarium.git .build/Kernarium
            git -C .build/Kernarium checkout --detach fbe12ee72d195f0241c4fc24090a98b259026604
          fi
          test "$(git -C .build/Kernarium rev-parse HEAD)" = fbe12ee72d195f0241c4fc24090a98b259026604
          vendor="$PWD/.build/Kernarium/android/lineage-24/build/build-aosp.sh"
          derived="$PWD/.build/Kernarium/android/lineage-24/build/build-aosp.andarium-host-ci.sh"
          python3 -B scripts/create_verified_soong_build_driver.py \
            --original "$vendor" --derived "$derived" \
            --audit "$PWD/.build/ci/pinned-vendor-audit.txt"
          bash -n "$derived"
          grep -F 'PATCH_ORDER=initial_verifiers_then_host_memory_then_restored_pristine_final_verifier' .build/ci/pinned-vendor-audit.txt
          rm -f -- "$derived"
          test -z "$(git -C .build/Kernarium status --porcelain --untracked-files=all)"
          echo 'PASS: exact pinned Kernarium build driver accepted and restored' >> "$GITHUB_STEP_SUMMARY"
