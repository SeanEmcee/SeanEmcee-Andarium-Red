name: Andarium Red - precompile all guest Java sources before AOSP
on:
  push:
    branches: [feature/andd-memory-tuning]
    paths:
      - 'build-requests/guest-java-preflight-*.txt'
permissions:
  contents: read
jobs:
  compile-guest-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile both guest modules against preinstalled Android SDK surface
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/preflight_android_guest_java.sh
          bash scripts/preflight_android_guest_java.sh
          echo 'PASS: full guest Java source preflight against Android SDK' >> "$GITHUB_STEP_SUMMARY"
