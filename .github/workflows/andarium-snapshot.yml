name: Andarium Red Android 17 Snapshot

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "First run probe; run snapshot only after probe passes"
        required: true
        type: choice
        default: probe
        options:
          - probe
          - snapshot

permissions:
  contents: read

jobs:
  modal-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_IMAGE_BUILDER_VERSION: "2025.06"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required Modal credentials
        shell: bash
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in repository Actions secrets before running."
            exit 1
          fi

      - name: Install snapshot-capable Modal SDK
        run: python -m pip install "modal==1.6.4"

      - name: Verify SDK functionality
        run: |
          python - <<'PY'
          import modal, sys
          print("PYTHON_VERSION", sys.version.split()[0])
          print("SNAPSHOT_API_AVAILABLE", hasattr(modal.Sandbox, "snapshot_directory"))
          assert hasattr(modal.Sandbox, "snapshot_directory")
          PY

      - name: Probe Sandbox creation (small test)
        if: ${{ inputs.operation == 'probe' }}
        run: modal run tools/andarium_snapshot.py::snapshot_sdk_probe

      - name: Launch Android 17 source snapshot (detached)
        if: ${{ inputs.operation == 'snapshot' }}
        run: modal run --detach tools/andarium_snapshot.py::snapshot_all_sources
