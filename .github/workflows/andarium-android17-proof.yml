name: Andarium Red Android 17 real image build

# A real x86_64 Linux AOSP builder with sufficient storage is mandatory.
# This never runs automatically or uses unverified kernel/guest inputs.
on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Successful Andarium Red host Actions run containing the ABI29 4KiB kernel"
        type: string
        required: true
      kernel_source_sha:
        description: "Exact source SHA of the kernel-producing host run"
        type: string
        required: true
      build_number:
        description: "Numeric Android 17 incremental build number"
        type: string
        required: true
      diagnostic_root:
        description: "Unsigned userdebug with real AOSP su (not Magisk)"
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: andarium-android17-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-red-guest:
    if: github.ref == 'refs/heads/feature/andd-memory-tuning'
    runs-on: [self-hosted, linux, x64, andarium-aosp17]
    timeout-minutes: 720
    steps:
      - name: Check out exact Red source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate artifact identity and build environment
        shell: bash
        env:
          KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
          KERNEL_SOURCE_SHA: ${{ inputs.kernel_source_sha }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$KERNEL_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 2
          [[ "$KERNEL_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || exit 2
          mkdir -p "$HOME/andarium-red-aosp17" .build
          available=$(df -Pk "$HOME/andarium-red-aosp17" | awk 'END { print $4 }')
          if [[ ! "$available" =~ ^[0-9]+$ ]] || (( available < 157286400 )); then
            echo "ERROR: x86_64 Linux AOSP workspace needs 150 GiB free" >&2
            exit 1
          fi
          for command in repo git java javac python3 zip unzip; do
            command -v "$command" || exit 1
          done
          git lfs version

      - name: Clone exact reviewed Kernarium
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/imxieyi/Kernarium.git .build/Kernarium
          git -C .build/Kernarium checkout --detach fbe12ee72d195f0241c4fc24090a98b259026604
          test "$(git -C .build/Kernarium rev-parse HEAD)" = fbe12ee72d195f0241c4fc24090a98b259026604

      - name: Obtain the authenticated ABI29 ARM64 4KiB kernel from successful host build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.kernel_run_id }}
          name: andarium-pinned-android17-abi29-4k-kernel-${{ inputs.kernel_source_sha }}
          github-token: ${{ github.token }}
          path: .build/android-kernel

      - name: Build actual modified Red Android 17 using the pinned Soong tree
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          DIAGNOSTIC_ROOT: ${{ inputs.diagnostic_root }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$DIAGNOSTIC_ROOT" == true ]]; then args+=(--diagnostic-userdebug); fi
          bash scripts/build_red_android17_proof.sh \
            "$PWD/.build/Kernarium" "$HOME/andarium-red-aosp17" \
            "$PWD/.build/android-kernel" "$PWD/.build/red-proof" \
            "$BUILD_NUMBER" --jobs 4 "${args[@]}"

      - name: Verify original developer proof contract and Red image identity
        shell: bash
        run: |
          set -euo pipefail
          python3 .build/Kernarium/Andarium/scripts/stage-system-image.py \
            --release "$PWD/.build/red-proof" --unsigned-proof \
            --output "$PWD/.build/andarium-system"
          python3 scripts/verify_red_android17_guest.py \
            --proof "$PWD/.build/red-proof" --kernarium "$PWD/.build/Kernarium"

      - name: Upload the verified Android17 proof image for real Red IPA build
        uses: actions/upload-artifact@v4
        with:
          name: andarium-red-android17-proof
          path: .build/red-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
