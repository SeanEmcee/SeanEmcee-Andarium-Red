name: Andarium Red - GitHub free capacity and genuine Android 17
# Do not attempt the 150+ GiB AOSP source tree on an unprovisioned free runner.
on:
  push:
    branches: [feature/andd-memory-tuning]
    paths:
      - 'build-requests/github-probe-*.txt'
      - 'build-requests/github-real-*.txt'
      - 'build-requests/github-hosted-*.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Capacity probe or genuine build on provisioned Linux x64'
        required: true
        type: choice
        default: probe
        options: [probe, self-hosted]
      build_number:
        description: 'Positive Android 17 build number'
        type: string
        required: true
        default: '1001'
      diagnostic_root:
        description: 'Unsigned userdebug diagnostic su; not Magisk'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: andarium-github-android17-feature
  cancel-in-progress: false

jobs:
  free-runner-capacity:
    if: github.ref == 'refs/heads/feature/andd-memory-tuning' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[github-probe]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim unrelated preinstalled toolchains on disposable free runner
        shell: bash
        run: bash scripts/prepare_github_hosted_disk.sh
      - name: Measure actual free runner storage, RAM and architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ci
          {
            echo "Andarium Red free GitHub runner capacity"
            echo "Source: $GITHUB_SHA"
            echo "Runner: $(uname -s) $(uname -m)"
            df -h /
            free -h
            available_kib="$(df -Pk / | awk 'END {print $4}')"
            echo "Available KiB: $available_kib"
            echo "Required for verified uncompressed AOSP workspace: 157286400 KiB (150 GiB)"
            if [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 && "$available_kib" =~ ^[0-9]+$ ]] && (( available_kib >= 157286400 )); then
              echo "CAPACITY_RESULT=POSSIBLE_TO_ATTEMPT (no compiled guest)"
            else
              echo "CAPACITY_RESULT=INSUFFICIENT_FOR_PINNED_ANDROID_17"
              echo "No Android sync attempted: do not waste free hosted runner credits."
            fi
          } | tee .build/ci/free-github-runner-capacity.txt
          cat .build/ci/free-github-runner-capacity.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: andarium-github-capacity
          path: .build/ci/free-github-runner-capacity.txt
          if-no-files-found: error
          retention-days: 14

  github-hosted-genuine-red-guest:
    # Deliberately opt-in. Never run on an unverified 14GB disk or for a probe.
    if: github.ref == 'refs/heads/feature/andd-memory-tuning' && github.event_name == 'push' && contains(github.event.head_commit.message, '[github-hosted]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      KERNARIUM_SHA: fbe12ee72d195f0241c4fc24090a98b259026604
      KERNEL_DIR: android-6.18-arm64-4k-20261119-6.18.60-ca1
      BUILD_NUMBER: '1001'
      ANDARIUM_COMPRESSED_HOST_RESERVE_GIB: '16'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim disk space and enforce sufficient capacity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_github_hosted_disk.sh
          test "$(uname -m)" = x86_64
          free_kib="$(df -Pk / | awk 'END{print $4}')"
          [[ "$free_kib" =~ ^[0-9]+$ ]] && (( free_kib >= 125829120 )) || {
            echo 'ERROR: Need >=120 GiB free for 104 GiB compressed AOSP and 16 GiB host reserve' >&2
            exit 1
          }
      - name: Install Linux Repo and Android 17 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y git-lfs repo openjdk-17-jdk python3 zip unzip curl jq btrfs-progs
          git config --global user.name 'Andarium Red CI'
          git config --global user.email 'andarium-red-ci@localhost.invalid'
          git lfs version
          repo version
          df -h /
      - uses: actions/cache/restore@v4
        with:
          path: .build/Kernarium
          key: andarium-gh-kernarium-fbe12ee72d195f0241c4fc24090a98b259026604
      - name: Restore or fetch exact pinned Kernarium source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          if [[ ! -d .build/Kernarium/.git ]]; then
            test ! -e .build/Kernarium
            git clone --filter=blob:none --no-checkout https://github.com/imxieyi/Kernarium.git .build/Kernarium
            git -C .build/Kernarium checkout --detach "$KERNARIUM_SHA"
          fi
          test "$(git -C .build/Kernarium rev-parse HEAD)" = "$KERNARIUM_SHA"
          test -z "$(git -C .build/Kernarium status --porcelain --untracked-files=all)"
      - uses: actions/cache/save@v4
        with:
          path: .build/Kernarium
          key: andarium-gh-kernarium-fbe12ee72d195f0241c4fc24090a98b259026604
      - uses: actions/cache/restore@v4
        with:
          path: .build/android-6.18-arm64-4k-20261119-6.18.60-ca1
          key: andarium-gh-abi29-69bd28b45746a09c7b52dfd0fcc9ce728a7b20d3cf9817fe78cbd29afa7cd166
      - name: Fetch or restore and independently verify ABI29 kernel
        shell: bash
        run: |
          set -euo pipefail
          kernel="$PWD/.build/$KERNEL_DIR"
          if [[ ! -d "$kernel" ]]; then
            test ! -e "$kernel"
            python3 scripts/download_verified_kernel_circleci.py
          fi
          common="$PWD/.build/Kernarium/kernel/common"
          python3 -B "$common/artifacts/verify-kernel-artifact.py" \
            --artifact "$kernel" --common-root "$common" \
            --kernel-metadata "$PWD/.build/Kernarium/kernel/mainline-6.18/patches/metadata.env" \
            --abi-metadata "$common/abi/identity.env"
          python3 -B "$common/artifacts/verify-kernel-artifact.py" \
            --artifact "$kernel" --common-root "$common" \
            --abi-metadata "$common/abi/identity.env" \
            --compatible --expected-family android-6.18 \
            --expected-slice arm64 --expected-release-series 6.18 \
            --descriptor "$PWD/.build/Kernarium/kernel/mainline-6.18/artifacts/accepted-android-4k.env"
      - uses: actions/cache/save@v4
        with:
          path: .build/android-6.18-arm64-4k-20261119-6.18.60-ca1
          key: andarium-gh-abi29-69bd28b45746a09c7b52dfd0fcc9ce728a7b20d3cf9817fe78cbd29afa7cd166
      - uses: actions/cache/restore@v4
        with:
          path: .build/accessibility-cache
          key: andarium-gh-accessibility-fbe12ee72d195f0241c4fc24090a98b259026604
      - name: Prepare or verify cached TalkBack eSpeak and libsonic checkouts
        shell: bash
        run: |
          set -euo pipefail
          git config --file "$PWD/.build/clean-gitconfig" user.name 'Andarium Red CI'
          git config --file "$PWD/.build/clean-gitconfig" user.email 'andarium-red-ci@localhost.invalid'
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL="$PWD/.build/clean-gitconfig"
          export GIT_TERMINAL_PROMPT=0
          bash scripts/prepare_accessibility_cache_circleci.sh "$PWD/.build/Kernarium" "$PWD/.build/accessibility-cache"
      - uses: actions/cache/save@v4
        with:
          path: .build/accessibility-cache
          key: andarium-gh-accessibility-fbe12ee72d195f0241c4fc24090a98b259026604
      - name: Initialize Btrfs compressed pinned Android 17 workspace
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_compressed_aosp_circleci.sh "$HOME/andarium-red-aosp17"
          test "$(stat -f -c %T "$HOME/andarium-red-aosp17")" = btrfs
      # Source seed is a small subset of immutable Git object stores, NOT
      # the full 100+ GiB AOSP source tree. Repo sync and all original source
      # verifiers must still run. Archive it BEFORE the expensive Soong phase.
      - name: Restore bounded Git object seed from previously pinned Repo sync
        id: repo_seed
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/andarium-red-aosp17/.andarium-repo-seed
          key: andarium-gh-repo-object-seed-v1-fbe12ee72d195f0241c4fc24090a98b259026604-20261115-los24-r28
      - name: Import cached bare Git objects for normal pinned Repo synchronization
        if: steps.repo_seed.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/prepare_pinned_repo_seed.py restore \
            --workspace "$HOME/andarium-red-aosp17" \
            --cache "$HOME/andarium-red-aosp17/.andarium-repo-seed"
      - name: Synchronize genuine pinned Android 17 sources and apply reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL="$PWD/.build/clean-gitconfig"
          export GIT_TERMINAL_PROMPT=0
          export ANDARIUM_ACCESSIBILITY_CACHE="$PWD/.build/accessibility-cache"
          bash scripts/build_red_android17_proof.sh \
            "$PWD/.build/Kernarium" "$HOME/andarium-red-aosp17" \
            "$PWD/.build/$KERNEL_DIR" "$PWD/.build/red-proof" \
            "$BUILD_NUMBER" --jobs 2 --diagnostic-userdebug --source-checkpoint-only
          echo "ANDROID17_SOURCE_SYNC_AND_PATCH_VERIFIED"
      - name: Create optional 3 GiB Git object seed after authenticated source sync
        if: steps.repo_seed.outputs.cache-hit != 'true'
        id: seed_created
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/prepare_pinned_repo_seed.py create \
            --workspace "$HOME/andarium-red-aosp17" \
            --cache "$HOME/andarium-red-aosp17/.andarium-repo-seed"
      - name: Persist reusable source Git objects before starting Soong
        if: steps.repo_seed.outputs.cache-hit != 'true' && steps.seed_created.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /home/runner/andarium-red-aosp17/.andarium-repo-seed
          key: andarium-gh-repo-object-seed-v1-fbe12ee72d195f0241c4fc24090a98b259026604-20261115-los24-r28
      - name: Compile actual LineageOS24 Android17 Red image and verify
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL="$PWD/.build/clean-gitconfig"
          export GIT_TERMINAL_PROMPT=0
          export ANDARIUM_ACCESSIBILITY_CACHE="$PWD/.build/accessibility-cache"
          # Keep telemetry in the active job log; post-failure steps may be
          # skipped if the hosted runner itself receives a shutdown signal.
          monitor() {
            while true; do
              echo "ANDROID17_RESOURCE_SAMPLE=$(date -u +%FT%TZ)"
              free -m || true
              df -h "$HOME/andarium-red-aosp17" / || true
              if [[ -r /sys/fs/cgroup/memory.events ]]; then
                echo "CGROUP_MEMORY_EVENTS"
                cat /sys/fs/cgroup/memory.events
              fi
              if [[ -r /sys/fs/cgroup/memory.current ]]; then
                echo "CGROUP_MEMORY_BYTES=$(cat /sys/fs/cgroup/memory.current)"
              fi
              sleep 45
            done
          }
          monitor &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT INT TERM
          bash scripts/build_red_android17_proof.sh \
            "$PWD/.build/Kernarium" "$HOME/andarium-red-aosp17" \
            "$PWD/.build/$KERNEL_DIR" "$PWD/.build/red-proof" \
            "$BUILD_NUMBER" --jobs 2 --diagnostic-userdebug --use-prepared-source
          python3 -B scripts/verify_red_android17_guest.py \
            --proof .build/red-proof --kernarium .build/Kernarium
          python3 .build/Kernarium/Andarium/scripts/stage-system-image.py \
            --release "$PWD/.build/red-proof" --unsigned-proof \
            --output "$PWD/.build/andarium-system"
      - name: Upload real verified Android 17 Red proof (never fabricated)
        uses: actions/upload-artifact@v4
        with:
          name: andarium-red-android17-proof
          path: .build/red-proof/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  genuine-red-guest:
    if: github.ref == 'refs/heads/feature/andd-memory-tuning' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[github-real]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'self-hosted'))
    runs-on: [self-hosted, linux, x64, andarium-aosp17]
    timeout-minutes: 1440
    env:
      KERNARIUM_SHA: fbe12ee72d195f0241c4fc24090a98b259026604
      KERNEL_DIR: android-6.18-arm64-4k-20261119-6.18.60-ca1
      BUILD_NUMBER: '1001'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify sufficient free storage and x86_64 Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
          mkdir -p "$HOME/andarium-red-aosp17" .build
          free_kib="$(df -Pk "$HOME/andarium-red-aosp17" | awk 'END{print $4}')"
          [[ "$free_kib" =~ ^[0-9]+$ ]] && (( free_kib >= 157286400 )) || {
            echo "ERROR: genuine LineageOS24 requires 150 GiB free before sync" >&2
            df -h "$HOME/andarium-red-aosp17" >&2
            exit 1
          }
          for cmd in git repo python3 zip unzip java javac; do
            command -v "$cmd" >/dev/null || {
              echo "ERROR: missing Linux build dependency: $cmd" >&2
              exit 1
            }
          done
          git lfs version
          git config --global user.name "Andarium Red CI"
          git config --global user.email "andarium-red-ci@localhost.invalid"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Fetch exact reviewed Kernarium source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/imxieyi/Kernarium.git .build/Kernarium
          git -C .build/Kernarium checkout --detach "$KERNARIUM_SHA"
          test "$(git -C .build/Kernarium rev-parse HEAD)" = "$KERNARIUM_SHA"

      - name: Restore published kernel and rerun unmodified ABI29 checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/download_verified_kernel_circleci.py
          common="$PWD/.build/Kernarium/kernel/common"
          kernel="$PWD/.build/$KERNEL_DIR"
          python3 -B "$common/artifacts/verify-kernel-artifact.py" \
            --artifact "$kernel" --common-root "$common" \
            --kernel-metadata "$PWD/.build/Kernarium/kernel/mainline-6.18/patches/metadata.env" \
            --abi-metadata "$common/abi/identity.env"
          python3 -B "$common/artifacts/verify-kernel-artifact.py" \
            --artifact "$kernel" --common-root "$common" \
            --abi-metadata "$common/abi/identity.env" --compatible \
            --expected-family android-6.18 --expected-slice arm64 \
            --expected-release-series 6.18 \
            --descriptor "$PWD/.build/Kernarium/kernel/mainline-6.18/artifacts/accepted-android-4k.env"

      - name: Compile actual pinned LineageOS24 with Red HOME and clipboard
        shell: bash
        run: |
          set -euo pipefail
          opts=(--jobs 4 --diagnostic-userdebug)
          bash scripts/build_red_android17_proof.sh \
            "$PWD/.build/Kernarium" "$HOME/andarium-red-aosp17" \
            "$PWD/.build/$KERNEL_DIR" "$PWD/.build/red-proof" \
            "$BUILD_NUMBER" "${opts[@]}"

      - name: Independently verify and stage genuine Android 17 image
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify_red_android17_guest.py \
            --proof .build/red-proof --kernarium .build/Kernarium
          python3 .build/Kernarium/Andarium/scripts/stage-system-image.py \
            --release "$PWD/.build/red-proof" --unsigned-proof \
            --output "$PWD/.build/andarium-system"

      - name: Upload authentic Android 17 proof for the existing Xcode IPA workflow
        uses: actions/upload-artifact@v4
        with:
          name: andarium-red-android17-proof
          path: .build/red-proof/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
