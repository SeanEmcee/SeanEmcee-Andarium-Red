version: 2.1

# Cloud-only Android 17 producer. Verified kernel is distributed as a
# public, SHA256-checked release; CircleCI requires no GitHub personal token.
# The 150 GB VM disk is a ceiling, not a guarantee that AOSP will fit.
jobs:
  android17-red-proof:
    machine:
      image: ubuntu-2404:current
    resource_class: large.gen2
    working_directory: ~/project
    environment:
      KERNEL_RUN_ID: "44663014989"
      KERNEL_SOURCE_SHA: "46d252bf087411be9a4dfe2013f321a06bc566c4"
      KERNARIUM_SHA: "fbe12ee72d195f0241c4fc24090a98b259026604"
      BUILD_NUMBER: "1001"
    steps:
      - checkout
      - run:
          name: Require exact source branch, x86_64 and adequate workspace
          command: |
            set -euo pipefail
            test "$CIRCLE_BRANCH" = "feature/andd-memory-tuning"
            test "$(uname -m)" = x86_64
            df -h .
            free -h
            # 150 GB decimal disks contain at most ~139.7 GiB before OS.
            # Fail before costly Repo sync if less than 110 GiB is free.
            free_kib=$(df -Pk "$HOME" | awk 'END {print $4}')
            test "$free_kib" -ge 115343360 || {
              echo "Insufficient free disk for attempted Android source build" >&2
              exit 1
            }
      - run:
          name: Install pinned build prerequisites
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            # Ubuntu 24.04 publishes Android's repo launcher as "repo" in multiverse.
            sudo add-apt-repository -y multiverse
            sudo apt-get update
            sudo apt-get install -y git-lfs repo openjdk-17-jdk python3 zip unzip curl jq btrfs-progs
            git lfs version
            repo version
      - run:
          name: Configure noninteractive Android Repo Git identity
          command: |
            set -euo pipefail
            # Repo init runs twice (initial workspace and pinned manifest prep).
            # Configure this ephemeral build VM rather than answering a prompt.
            git config --global user.name "Andarium Red CI"
            git config --global user.email "andarium-red-ci@localhost.invalid"
            test "$(git config --global --get user.name)" = "Andarium Red CI"
            test "$(git config --global --get user.email)" = "andarium-red-ci@localhost.invalid"
            echo "Configured noninteractive Android Repo identity for this CI machine."
      - restore_cache:
          keys:
            - andarium-v1-reviewed-kernarium-fbe12ee72d195f0241c4fc24090a98b259026604
      - run:
          name: Restore or fetch verified Kernarium source
          command: |
            set -euo pipefail
            mkdir -p .build
            if [[ ! -d .build/Kernarium/.git ]]; then
              test ! -e .build/Kernarium
              git clone --filter=blob:none --no-checkout https://github.com/imxieyi/Kernarium.git .build/Kernarium
              git -C .build/Kernarium checkout --detach "$KERNARIUM_SHA"
            fi
            test "$(git -C .build/Kernarium rev-parse HEAD)" = "$KERNARIUM_SHA"
            test -z "$(git -C .build/Kernarium status --porcelain --untracked-files=all)"
      - save_cache:
          key: andarium-v1-reviewed-kernarium-fbe12ee72d195f0241c4fc24090a98b259026604
          paths:
            - .build/Kernarium
      - restore_cache:
          keys:
            - andarium-v1-abi29-69bd28b45746a09c7b52dfd0fcc9ce728a7b20d3cf9817fe78cbd29afa7cd166
      - run:
          name: Restore or fetch and independently verify pinned kernel
          command: |
            set -euo pipefail
            kernel="$PWD/.build/android-6.18-arm64-4k-20261119-6.18.60-ca1"
            if [[ ! -d "$kernel" ]]; then
              test ! -e "$kernel"
              python3 scripts/download_verified_kernel_circleci.py
            fi
            common="$PWD/.build/Kernarium/kernel/common"
            python3 -B "$common/artifacts/verify-kernel-artifact.py" \
              --artifact "$kernel" --common-root "$common" \
              --kernel-metadata "$PWD/.build/Kernarium/kernel/mainline-6.18/patches/metadata.env" \
              --abi-metadata "$common/abi/identity.env"
            python3 -B "$common/artifacts/verify-kernel-artifact.py" \
              --artifact "$kernel" --common-root "$common" \
              --abi-metadata "$common/abi/identity.env" --compatible \
              --expected-family android-6.18 --expected-slice arm64 \
              --expected-release-series 6.18 \
              --descriptor "$PWD/.build/Kernarium/kernel/mainline-6.18/artifacts/accepted-android-4k.env"
      - save_cache:
          key: andarium-v1-abi29-69bd28b45746a09c7b52dfd0fcc9ce728a7b20d3cf9817fe78cbd29afa7cd166
          paths:
            - .build/android-6.18-arm64-4k-20261119-6.18.60-ca1
      # Cache the expensive pinned accessibility Git histories and patch replay
      # separately from Android Repo's very large source workspace. This is
      # saved as soon as the source is independently verified, even if Soong
      # fails later in the job.
      - restore_cache:
          keys:
            - andarium-v1-accessibility-fbe12ee72d195f0241c4fc24090a98b259026604
      - run:
          name: Restore or build verified pinned TalkBack eSpeak and libsonic source cache
          command: |
            set -euo pipefail
            mkdir -p .build
            git config --file "$PWD/.build/clean-gitconfig" user.name "Andarium Red CI"
            git config --file "$PWD/.build/clean-gitconfig" user.email "andarium-red-ci@localhost.invalid"
            export GIT_CONFIG_NOSYSTEM=1
            export GIT_CONFIG_GLOBAL="$PWD/.build/clean-gitconfig"
            export GIT_TERMINAL_PROMPT=0
            bash scripts/prepare_accessibility_cache_circleci.sh "$PWD/.build/Kernarium" "$PWD/.build/accessibility-cache"
      - save_cache:
          key: andarium-v1-accessibility-fbe12ee72d195f0241c4fc24090a98b259026604
          paths:
            - .build/accessibility-cache

      - run:
          name: Prepare disk-compressed source and Soong workspace (experimental)
          command: |
            set -euo pipefail
            bash scripts/prepare_compressed_aosp_circleci.sh "$HOME/andarium-red-aosp17"
      - run:
          name: Compile genuine modified Red Android 17 image and verify
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            test "$(stat -f -c %T "$HOME/andarium-red-aosp17")" = btrfs
            # Git identity stays available, but URL rewriting cannot change
            # the origin seen by the pinned accessibility source verifier.
            export GIT_CONFIG_NOSYSTEM=1
            export GIT_CONFIG_GLOBAL="$PWD/.build/clean-gitconfig"
            export GIT_TERMINAL_PROMPT=0
            export ANDARIUM_ACCESSIBILITY_CACHE="$PWD/.build/accessibility-cache"
            bash scripts/build_red_android17_proof.sh \
              "$PWD/.build/Kernarium" "$HOME/andarium-red-aosp17" \
              "$PWD/.build/android-6.18-arm64-4k-20261119-6.18.60-ca1" "$PWD/.build/red-proof" \
              "$BUILD_NUMBER" --jobs 2 --diagnostic-userdebug
            python3 .build/Kernarium/Andarium/scripts/stage-system-image.py \
              --release "$PWD/.build/red-proof" --unsigned-proof \
              --output "$PWD/.build/andarium-system"
      - run:
          name: Record compressed workspace disk usage, including failures
          when: always
          command: |
            set -euo pipefail
            df -h "$HOME/andarium-red-aosp17" /
            sudo btrfs filesystem usage "$HOME/andarium-red-aosp17" || true
      - store_artifacts:
          path: .build/red-proof
          destination: andarium-red-android17-proof
      - store_artifacts:
          path: .build/andarium-system
          destination: andarium-system-verified
workflows:
  android17-proof:
    jobs:
      - android17-red-proof:
          filters:
            branches:
              only: feature/andd-memory-tuning
