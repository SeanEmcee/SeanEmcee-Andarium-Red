version: 2.1

# Cloud-only Android 17 producer. Verified kernel is distributed as a
# public, SHA256-checked release; CircleCI requires no GitHub personal token.
# The 150 GB VM disk is a ceiling, not a guarantee that AOSP will fit.
jobs:
  android17-red-proof:
    machine:
      image: ubuntu-2404:current
    resource_class: large.gen2
    working_directory: ~/project
    environment:
      KERNEL_RUN_ID: "44663014989"
      KERNEL_SOURCE_SHA: "46d252bf087411be9a4dfe2013f321a06bc566c4"
      KERNARIUM_SHA: "fbe12ee72d195f0241c4fc24090a98b259026604"
      BUILD_NUMBER: "1001"
    steps:
      - checkout
      - run:
          name: Require exact source branch, x86_64 and adequate workspace
          command: |
            set -euo pipefail
            test "$CIRCLE_BRANCH" = "feature/andd-memory-tuning"
            test "$(uname -m)" = x86_64
            df -h .
            free -h
            # 150 GB decimal disks contain at most ~139.7 GiB before OS.
            # Fail before costly Repo sync if less than 110 GiB is free.
            free_kib=$(df -Pk "$HOME" | awk 'END {print $4}')
            test "$free_kib" -ge 115343360 || {
              echo "Insufficient free disk for attempted Android source build" >&2
              exit 1
            }
      - run:
          name: Install pinned build prerequisites
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            # Ubuntu 24.04 publishes Android's repo launcher as "repo" in multiverse.
            sudo add-apt-repository -y multiverse
            sudo apt-get update
            sudo apt-get install -y git-lfs repo openjdk-17-jdk python3 zip unzip curl jq btrfs-progs
            git lfs version
            repo version
      - run:
          name: Configure noninteractive Android Repo Git identity
          command: |
            set -euo pipefail
            # Repo init runs twice (initial workspace and pinned manifest prep).
            # Configure this ephemeral build VM rather than answering a prompt.
            git config --global user.name "Andarium Red CI"
            git config --global user.email "andarium-red-ci@localhost.invalid"
            test "$(git config --global --get user.name)" = "Andarium Red CI"
            test "$(git config --global --get user.email)" = "andarium-red-ci@localhost.invalid"
            echo "Configured noninteractive Android Repo identity for this CI machine."
      - run:
          name: Checkout exact reviewed Kernarium
          command: |
            set -euo pipefail
            mkdir -p .build
            git clone --filter=blob:none --no-checkout https://github.com/imxieyi/Kernarium.git .build/Kernarium
            git -C .build/Kernarium checkout --detach "$KERNARIUM_SHA"
            test "$(git -C .build/Kernarium rev-parse HEAD)" = "$KERNARIUM_SHA"
      - run:
          name: Download verified kernel from public GitHub release without a token
          command: |
            set -euo pipefail
            python3 scripts/download_verified_kernel_circleci.py

      - run:
          name: Prepare disk-compressed source and Soong workspace (experimental)
          command: |
            set -euo pipefail
            bash scripts/prepare_compressed_aosp_circleci.sh "$HOME/andarium-red-aosp17"
      - run:
          name: Compile genuine modified Red Android 17 image and verify
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            test "$(stat -f -c %T "$HOME/andarium-red-aosp17")" = btrfs
            bash scripts/build_red_android17_proof.sh \
              "$PWD/.build/Kernarium" "$HOME/andarium-red-aosp17" \
              "$PWD/.build/android-6.18-arm64-4k-20261119-6.18.60-ca1" "$PWD/.build/red-proof" \
              "$BUILD_NUMBER" --jobs 2 --diagnostic-userdebug
            python3 .build/Kernarium/Andarium/scripts/stage-system-image.py \
              --release "$PWD/.build/red-proof" --unsigned-proof \
              --output "$PWD/.build/andarium-system"
      - run:
          name: Record compressed workspace disk usage, including failures
          when: always
          command: |
            set -euo pipefail
            df -h "$HOME/andarium-red-aosp17" /
            sudo btrfs filesystem usage "$HOME/andarium-red-aosp17" || true
      - store_artifacts:
          path: .build/red-proof
          destination: andarium-red-android17-proof
      - store_artifacts:
          path: .build/andarium-system
          destination: andarium-system-verified
workflows:
  android17-proof:
    jobs:
      - android17-red-proof:
          filters:
            branches:
              only: feature/andd-memory-tuning
